<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title description">
  <title id="title">Password Security in Practice — Week 3 Lab</title>
  <desc id="description">LinkedIn poster about an authorized coursework lab exploring PDF password auditing with John the Ripper and Networkwalks tools.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071525"/>
      <stop offset="0.58" stop-color="#0c2236"/>
      <stop offset="1" stop-color="#10384a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38e0ca"/>
      <stop offset="1" stop-color="#83f0b4"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#9db6c8" opacity="0.12"/>
    </pattern>
  </defs>

  <rect width="1080" height="1350" fill="url(#background)"/>
  <rect width="1080" height="1350" fill="url(#dots)"/>
  <circle cx="1010" cy="94" r="255" fill="#38e0ca" opacity="0.055"/>
  <circle cx="1010" cy="94" r="174" fill="none" stroke="#38e0ca" stroke-width="1.5" opacity="0.18"/>
  <circle cx="1010" cy="94" r="126" fill="none" stroke="#83f0b4" stroke-width="1.5" opacity="0.15"/>
  <path d="M0 1050 C220 930 355 1130 560 1030 S900 900 1080 1015 V1350 H0Z" fill="#0a1928" opacity="0.7"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="76" y="64" width="412" height="46" rx="23" fill="#17364a" stroke="#2c6571"/>
    <circle cx="100" cy="87" r="6" fill="#5be2c4"/>
    <text x="118" y="94" fill="#d8f9ef" font-size="18" font-weight="700" letter-spacing="2">WEEK 3  /  CYBERSECURITY LAB</text>

    <text x="76" y="192" fill="#f4f8fb" font-size="72" font-weight="800" letter-spacing="-2">PASSWORD</text>
    <text x="76" y="276" fill="#f4f8fb" font-size="72" font-weight="800" letter-spacing="-2">SECURITY</text>
    <text x="76" y="360" fill="url(#accent)" font-size="72" font-weight="800" letter-spacing="-2">IN PRACTICE.</text>

    <text x="80" y="414" fill="#b9cad6" font-size="24">Exploring authorized PDF password auditing</text>
    <text x="80" y="448" fill="#b9cad6" font-size="24">and the process behind password recovery.</text>

    <rect x="76" y="490" width="928" height="270" rx="28" fill="#102a3d" stroke="#2d5264" stroke-width="2"/>
    <text x="112" y="537" fill="#74e6cc" font-size="17" font-weight="700" letter-spacing="2.5">THE LAB WORKFLOW</text>

    <rect x="112" y="569" width="224" height="116" rx="18" fill="#15384a"/>
    <rect x="142" y="589" width="44" height="54" rx="7" fill="none" stroke="#d5f4ed" stroke-width="3"/>
    <path d="M154 589v-8a10 10 0 0 1 20 0v8" fill="none" stroke="#d5f4ed" stroke-width="3"/>
    <circle cx="164" cy="614" r="3.5" fill="#69e5c7"/>
    <path d="M164 618v7" stroke="#69e5c7" stroke-width="3"/>
    <text x="203" y="615" fill="#f5fafc" font-size="21" font-weight="700">Protected</text>
    <text x="203" y="643" fill="#b9cad6" font-size="18">PDF file</text>

    <path d="M350 627h47" stroke="#55dec4" stroke-width="3"/>
    <path d="m388 618 11 9-11 9" fill="none" stroke="#55dec4" stroke-width="3"/>

    <rect x="412" y="569" width="224" height="116" rx="18" fill="#15384a"/>
    <text x="442" y="624" fill="#7ce8ce" font-family="Consolas, monospace" font-size="28" font-weight="700">$pdf$...</text>
    <text x="442" y="653" fill="#b9cad6" font-size="18">Hash representation</text>

    <path d="M650 627h47" stroke="#55dec4" stroke-width="3"/>
    <path d="m688 618 11 9-11 9" fill="none" stroke="#55dec4" stroke-width="3"/>

    <rect x="712" y="569" width="256" height="116" rx="18" fill="#15384a"/>
    <path d="M749 601h37M749 615h54M749 629h44M749 643h31" stroke="#73e4cc" stroke-width="3" stroke-linecap="round"/>
    <text x="816" y="615" fill="#f5fafc" font-size="21" font-weight="700">Candidate</text>
    <text x="816" y="643" fill="#b9cad6" font-size="18">testing + verify</text>

    <text x="112" y="723" fill="#91aabb" font-size="16">A matching candidate is checked against the authorized lab PDF.</text>

    <text x="80" y="827" fill="#f3f7fa" font-size="29" font-weight="700">TOOLS I EXPLORED</text>
    <path d="M80 847h920" stroke="#315266" stroke-width="2"/>
    <circle cx="94" cy="894" r="5" fill="#5be2c4"/>
    <text x="116" y="902" fill="#eff7fa" font-size="22"><tspan font-weight="700">John the Ripper + Johnny</tspan><tspan fill="#a9bdca">  /  desktop lab workflow</tspan></text>
    <circle cx="94" cy="940" r="5" fill="#5be2c4"/>
    <text x="116" y="948" fill="#eff7fa" font-size="22"><tspan font-weight="700">Networkwalks tools</tspan><tspan fill="#a9bdca">  /  browser-based workflow</tspan></text>

    <rect x="76" y="988" width="928" height="158" rx="24" fill="#123143" stroke="#276071"/>
    <text x="112" y="1034" fill="#7de8cf" font-size="17" font-weight="700" letter-spacing="2.5">KEY TAKEAWAYS</text>
    <circle cx="120" cy="1075" r="4" fill="#83f0b4"/>
    <text x="139" y="1082" fill="#ecf4f7" font-size="20">Weak, predictable passwords are easier to guess.</text>
    <circle cx="120" cy="1112" r="4" fill="#83f0b4"/>
    <text x="139" y="1119" fill="#ecf4f7" font-size="20">Long, unique passwords improve resistance to guessing.</text>

    <rect x="76" y="1172" width="928" height="72" rx="18" fill="url(#accent)"/>
    <text x="108" y="1217" fill="#082331" font-size="23" font-weight="800">LEARN. TEST ETHICALLY. PROTECT WHAT MATTERS.</text>

    <text x="80" y="1290" fill="#bfd0da" font-size="17">Coursework • Authorized practice files only • No credentials or hashes shared</text>
    <text x="80" y="1322" fill="#72e4ca" font-size="17" font-weight="700">PROJECT &amp; FULL LAB NOTES</text>
    <text x="354" y="1322" fill="#e1edf2" font-size="17">github.com/sphumelelemtetwa11/week-3-password-security-labs</text>
  </g>
</svg>
